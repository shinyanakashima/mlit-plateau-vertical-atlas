# GitHub Pages: one site with both prototypes
#   /            ← main          (PLATEAU Vertical Atlas)
#   /lt11/       ← lt11-mansion  (東京は何階建て？)
# Runs on every push to either branch (and manually).  The same file lives on both branches.
# The github-pages environment only accepts deployments from the default branch, so a push to
# lt11-mansion just dispatches this workflow on main, which builds and deploys both.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main, lt11-mansion]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/lt11-mansion'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy-pages.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: lt11-mansion
          path: lt11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build main (Vertical Atlas)
        working-directory: main
        run: npm ci && npm run build
      - name: Build lt11-mansion (東京は何階建て？)
        working-directory: lt11
        run: npm ci && npm run build
      - name: Assemble site
        run: |
          mkdir site
          cp -r main/dist/. site/
          mkdir site/lt11
          cp -r lt11/dist/. site/lt11/
          du -sh site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
